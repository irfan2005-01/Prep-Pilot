spring.application.name=prep-pilot-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# Multipart Upload Limits (5 MB max resume file size)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.enabled=true

# Gemini API Configuration (server-side only, never exposed to client)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:45}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Document Extraction Safety Limits
resume.max-pages=10
resume.max-characters=50000

# Logging: Do not log sensitive resume contents
logging.level.com.nexpilot.resumepilot=INFO
logging.level.org.springframework.web=INFO

