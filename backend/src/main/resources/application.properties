spring.application.name=prep-pilot-backend

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Multipart Upload Limits (5 MB max resume file size)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.enabled=true

# Gemini API Configuration (server-side only, never exposed to client)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:45}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Document Extraction Safety Limits
resume.max-pages=10
resume.max-characters=50000

# Database & Persistence Configuration (PostgreSQL default, overridable by DB_URL or SPRING_DATASOURCE_URL)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/preppilot}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging: Do not log sensitive resume contents
logging.level.com.nexpilot.resumepilot=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO

