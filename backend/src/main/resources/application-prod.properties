# The browser and API are hosted on different sites. Cross-site session cookies
# must be explicitly Secure and SameSite=None to accompany credentialed fetches.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Keep credentialed CORS restricted to explicitly configured frontend origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://prep-pilot-gules.vercel.app}
